name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # El límite por defecto de GitHub son seis horas. Un job colgado se quedaría
    # ahí consumiendo minutos de la cuenta antes de rendirse.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      # Nada verificaba este portal antes de publicarlo: el workflow instalaba,
      # compilaba y desplegaba. El linter y las pruebas ya existían desde hacía
      # tiempo, pero no los ejecutaba nadie. Ahora son una puerta: si fallan, no
      # se despliega.
      - name: Verificar
        run: npm run verificar

      - name: Build with Astro
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
