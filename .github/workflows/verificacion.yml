name: Verificación

# El workflow de despliegue solo corre al empujar a `main`, y además solo
# compilaba: el linter y las pruebas existían pero nada las ejecutaba. Este
# corre en el pull request, que es donde sirve enterarse.
on:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    # El límite por defecto de GitHub son seis horas. Un job colgado se quedaría
    # ahí consumiendo minutos de la cuenta antes de rendirse.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hasta ahora `npm run format` ni siquiera funcionaba: Prettier no sabía
      # leer los `.astro` porque faltaba `prettier-plugin-astro`, y dos archivos
      # ya habían divergido de su propio formato sin que nada se quejara.
      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # `astro check` es lo que compila de verdad el TypeScript del navegador.
      # En el sitio principal fue lo que atrapó un `i is not defined` que ya
      # había llegado a producción, y aquí encontró cuatro errores en la
      # primera pasada.
      - name: Comprobación de tipos
        run: npm run check

      - name: Pruebas
        run: npm test

      # `npm run build` termina llamando a `scripts/verificar-salida.mjs`.
      # Hace falta compilar en el pull request porque hay una clase de fallo que
      # solo se ve en `dist/`: la redirección de la raíz apuntaba fuera del
      # sitio —Astro no antepone `base` al destino de un redirect— y ni el
      # linter, ni los tipos, ni las pruebas, ni `npm run dev` lo notaban.
      - name: Compilación y comprobación de la salida
        run: npm run build
